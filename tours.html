/* ── tours 전용 ── */
.tours-hero{
  background:linear-gradient(135deg,#1640B0 0%,#1B4FD8 55%,#F97316 130%);
  color:#fff;padding:56px 20px 48px;text-align:center;
}
.tours-hero h1{font-size:30px;font-weight:900;margin-bottom:10px;letter-spacing:-.02em}
.tours-hero p{font-size:15px;opacity:.9}
.tours-wrap{max-width:820px;margin:0 auto;padding:0 16px 60px}

.tt-tabs{
  display:flex;gap:6px;overflow-x:auto;margin:-26px 0 18px;padding:6px;
  background:#fff;border-radius:14px;box-shadow:var(--shadow);position:relative;z-index:10;
}
.tt-tabs::-webkit-scrollbar{display:none}
.tt-tab{
  flex:1;white-space:nowrap;padding:12px;border:none;background:none;border-radius:10px;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--gray-600);cursor:pointer;
  transition:.15s;min-width:max-content;
}
.tt-tab.active{background:var(--primary);color:#fff}

.tt-panel{display:none;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.tt-panel.active{display:block}
.tt-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tt-field{flex:1;min-width:120px;display:flex;flex-direction:column;gap:5px}
.tt-field label{font-size:12px;font-weight:600;color:var(--gray-600)}
.tt-field input,.tt-field select{
  border:1px solid var(--gray-200);border-radius:10px;padding:12px;font-size:15px;
  font-family:inherit;color:var(--dark);outline:none;background:#fff;
}
.tt-field input:focus,.tt-field select:focus{border-color:var(--primary)}
.tt-btn{
  width:100%;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:15px;
  font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;margin-top:4px;
}
.tt-btn:hover{background:var(--primary-dark)}
.tt-btn:disabled{opacity:.6;cursor:not-allowed}

.tt-results{margin-top:4px}
.tt-card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);white-space:pre-wrap;font-size:14.5px;line-height:1.95;
}
.tt-card strong{color:var(--primary-dark);font-weight:700}
.tt-card .star{color:#F59E0B}
.tt-card .price{color:var(--accent-dark);font-weight:700}
.tt-loading{text-align:center;padding:40px;color:var(--gray-400);font-size:14px}
.tt-spin{width:28px;height:28px;border:3px solid var(--gray-200);border-top-color:var(--primary);
  border-radius:50%;animation:ttspin .8s linear infinite;margin:0 auto 12px}
@keyframes ttspin{to{transform:rotate(360deg)}}
.tt-err{background:#FFF5F5;border:1px solid #FFD0D0;color:#C92A2A;border-radius:12px;padding:14px 16px;font-size:13.5px}
.tt-retry{margin-top:10px;padding:8px 16px;border:1px solid var(--primary);background:#fff;color:var(--primary);border-radius:8px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.tt-retry:hover{background:var(--primary);color:#fff}
.tt-cta{
  display:block;text-align:center;margin-top:14px;background:#FFF3E9;color:var(--accent-dark);
  border-radius:12px;padding:14px;font-size:14px;font-weight:700;transition:.15s;
}
.tt-cta:hover{filter:brightness(.96)}
.tt-compare-lbl{font-size:12px;font-weight:700;color:var(--gray-600);margin:18px 0 8px;text-align:center}
.tt-btn:disabled{opacity:.55;cursor:not-allowed}

/* 빈 초기 상태 */
.tt-empty{text-align:center;padding:44px 20px;color:var(--gray-400)}
.tt-empty-icon{font-size:34px;margin-bottom:10px}
.tt-empty-ex{font-size:12px;color:var(--gray-400);margin-top:10px;line-height:1.7}

/* 항공편 카드 */
.tt-flight-head{font-size:13px;font-weight:700;color:var(--gray-600);margin-bottom:10px;padding:0 2px}
.tt-flight-card{
  display:block;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:15px 18px;box-shadow:var(--shadow);margin-bottom:10px;transition:.15s;position:relative;
}
a.tt-flight-card:hover{border-color:var(--primary);box-shadow:var(--shadow-hover)}
.tt-flight-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tt-flight-air{font-size:15px;font-weight:700;color:var(--dark)}
.tt-flight-no{font-size:12px;font-weight:500;color:var(--gray-400)}
.tt-flight-badge{background:#FFF3E9;color:var(--accent-dark);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.tt-flight-price{margin-left:auto;font-size:17px;font-weight:800;color:var(--primary)}
.tt-flight-leg{font-size:13px;color:var(--gray-600);line-height:1.9}
.tt-flight-leg b{color:var(--dark);font-weight:700}
.tt-leg-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--gray-400);background:var(--gray-100);padding:1px 6px;border-radius:5px;margin-right:4px}
.tt-leg-dur{font-size:11px;color:var(--gray-400);margin-left:4px}
.tt-flight-cta{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--accent-dark)}
.tt-flight-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tt-flight-head>span{flex:1;min-width:0}
.tt-sort{border:1px solid var(--gray-200);border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:inherit;color:var(--dark);background:#fff;cursor:pointer;outline:none}

/* 서브 버튼 (캘린더) */
.tt-btn-sub{background:#fff;color:var(--primary);border:1.5px solid var(--primary);margin-top:8px}
.tt-btn-sub:hover{background:var(--primary-lt)}

.tt-history:empty{display:none}
.tt-hist-lbl{font-size:12px;font-weight:700;color:var(--gray-400);margin-right:2px}

.tt-note{font-size:11.5px;color:var(--gray-400);text-align:center;margin-top:22px;line-height:1.7}

/* ── 결과 카드 그리드 (투어·티켓 / 숙소) ── */
.tt-items-head{display:flex;align-items:center;justify-content:space-between;gap:10px;

.tt-grid{display:grid;grid-template-columns:1fr;gap:12px}
.tt-item{

  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;
}
a.tt-item:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,24,40,.12);border-color:var(--primary-lt,#C7D6FF)}
.tt-thumb{position:relative;flex:0 0 138px;width:138px;background:var(--gray-100);overflow:hidden}
.tt-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tt-thumb-none{display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--gray-300)}
.tt-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding:13px 15px}
.tt-badges{display:flex;gap:5px;flex-wrap:wrap}
.tt-badge{font-size:10.5px;font-weight:700;color:var(--primary);background:var(--primary-lt,#EAF0FF);
  padding:2px 8px;border-radius:6px;letter-spacing:-.01em}
.tt-title2{font-size:15px;font-weight:700;line-height:1.4;color:var(--dark);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.tt-metarow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.tt-rate{font-size:12.5px;font-weight:700;color:#B45309}
.tt-rate small{color:var(--gray-400);font-weight:500}
.tt-mloc{font-size:12px;color:var(--gray-500);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tt-pricerow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tt-price2{font-size:18px;font-weight:800;color:var(--primary)}
.tt-book{font-size:12.5px;font-weight:700;color:var(--accent-dark);white-space:nowrap}

/* 페이지네이션 */
.tt-pager{display:flex;align-items:center;justify-content:center;gap:6px;margin:18px 0 4px;flex-wrap:wrap}
.tt-page-btn{min-width:36px;height:36px;padding:0 10px;border:1px solid var(--gray-200);background:#fff;
  border-radius:9px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--gray-600);cursor:pointer;transition:.12s}
.tt-page-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.tt-page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.tt-page-btn:disabled{opacity:.4;cursor:not-allowed}

@media(max-width:640px){
  .tours-hero h1{font-size:24px}
  .tt-field input,.tt-field select{font-size:16px} /* iOS 줌 방지 */
  .tt-thumb{flex-basis:104px;width:104px}
  .tt-title2{font-size:14px}
  .tt-price2{font-size:16px}
  .tt-info{padding:11px 12px}
}

<script>
/* ═══════════════════════════════════════════
   제휴(어필리에이트) 설정
   마이리얼트립 파트너스 가입 후 발급받은 값을 넣으면
   모든 예약 링크에 자동으로 추적 파라미터가 붙습니다.
   미설정(빈 문자열) 시 일반 링크로 동작합니다.
   ═══════════════════════════════════════════ */
const MRT_AFFILIATE = { param: 'utm_source', value: 'tripguide' }; // TODO: 마이리얼트립 파트너스 발급값으로 교체

function affLink(baseUrl){
  if(!MRT_AFFILIATE.value) return baseUrl;
  const u = new URL(baseUrl);
  u.searchParams.set(MRT_AFFILIATE.param, MRT_AFFILIATE.value);
  u.searchParams.set('utm_medium', 'referral');
  u.searchParams.set('utm_campaign', 'tripguide');
  return u.toString();
}

/* ═══════════════════════════════════════════
   메타서치 제휴 파트너 레지스트리
   마이리얼트립 외 플랫폼은 공개 검색 API가 없어 라이브 결과 대신
   검색어를 각 플랫폼 검색 페이지로 넘기는 "제휴 딥링크"로 처리한다.
   aff 값을 채우면 추적 파라미터가 자동으로 붙는다(미설정 시 일반 링크).
   types: 'tna'(투어·티켓) / 'stay'(숙소)
   ═══════════════════════════════════════════ */
const PARTNERS = [
  { key:'klook',   label:'클룩',      color:'#e8384f', bg:'#FFF0F3',
    base:'https://www.klook.com/ko/search/', qkey:'query', types:['tna','stay'],
    aff:{} /* {aid, aff_adid} */ },
  { key:'kkday',   label:'KKday',     color:'#ff5b00', bg:'#FFF1E8',
    base:'https://www.kkday.com/ko/product/productlist', qkey:'keyword', types:['tna'],
    aff:{} /* {cid} */ },
  { key:'booking', label:'부킹닷컴',   color:'#003580', bg:'#EAF0FF',
    base:'https://www.booking.com/searchresults.ko.html', qkey:'ss', types:['stay'],
    aff:{} /* {aid} */ },
  { key:'agoda',   label:'아고다',     color:'#c1272d', bg:'#FDECEA',
    base:'https://www.agoda.com/ko-kr/search', qkey:'textToSearch', types:['stay'],
    aff:{} /* {cid} */ },
];

function partnerUrl(p, query){
  const u = new URL(p.base);
  u.searchParams.set(p.qkey, query);
  for(const [k,v] of Object.entries(p.aff || {})){ if(v) u.searchParams.set(k, v); }
  return u.toString();
}

// 탭 종류(type)에 맞는 파트너 비교 CTA HTML
function partnerCtas(query, type){
  const safeQ = esc(query);
  return PARTNERS.filter(p => p.types.includes(type)).map(p =>
    `<a class="tt-cta" style="background:${p.bg};color:${p.color}" href="${esc(partnerUrl(p, query))}" target="_blank" rel="noopener">🔎 ${esc(p.label)}에서 "${safeQ}" 비교 ↗</a>`
  ).join('');
}

const $ = id => document.getElementById(id);

// HTML 이스케이프 (사용자 입력 안전 삽입)
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 항공사 코드 → 한글명
const AIRLINE = {
  KE:'대한항공', OZ:'아시아나', '7C':'제주항공', LJ:'진에어', TW:'티웨이',
  BX:'에어부산', RS:'에어서울', RF:'에어로케이', YP:'에어프레미아', ZE:'이스타항공',
  JL:'일본항공', NH:'전일본공수', MU:'중국동방', CZ:'중국남방', CI:'중화항공',
  BR:'에바항공', TG:'타이항공', VN:'베트남항공', VJ:'비엣젯', SQ:'싱가포르항공',
};
function airlineName(code){ return AIRLINE[code] || code || '항공사'; }

/* ── 검색 히스토리 (localStorage, 최근 8건) ── */
const TT_HIST_KEY = 'tt_search_history';
function getHist(){ try{ return JSON.parse(localStorage.getItem(TT_HIST_KEY)||'[]'); }catch{ return []; } }
function saveHist(entry){
  let h = getHist().filter(x => x.label !== entry.label);
  h.unshift(entry); h = h.slice(0, 8);
  localStorage.setItem(TT_HIST_KEY, JSON.stringify(h));
  renderHistory();
}
function clearHist(){ localStorage.removeItem(TT_HIST_KEY); renderHistory(); }
function renderHistory(){
  const box = $('tt-history'); if(!box) return;
  const h = getHist();
  if(!h.length){ box.innerHTML=''; return; }
  box.innerHTML = `<span class="tt-hist-lbl">🕘 최근 검색</span>` +
    h.map((e,i)=>`<button class="tt-hist-chip" onclick="applyHist(${i})">${esc(e.label)}</button>`).join('') +
    `<button class="tt-hist-clear" onclick="clearHist()" title="전체 삭제">✕</button>`;
}
function applyHist(i){
  const e = getHist()[i]; if(!e) return;
  // 탭 전환
  const tabBtn = [...document.querySelectorAll('.tt-tab')].find(b => b.dataset.tab === e.tab);
  if(tabBtn) ttSwitch(e.tab, tabBtn);
  // 필드 복원 후 검색
  const f = e.fields || {};
  Object.entries(f).forEach(([id,v]) => { const el=$(id); if(el) el.value=v; });
  ({tna:ttRunTna, stay:ttRunStay, dom:ttRunDom, intl:ttRunIntl}[e.tab] || (()=>{}))();
}

function ttSwitch(tab, btn){
  document.querySelectorAll('.tt-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tt-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  $('tt-panel-' + tab).classList.add('active');
  $('tt-results').innerHTML = '';
}

// 오늘 날짜(YYYY-MM-DD)
function todayISO(){ return new Date().toISOString().slice(0,10); }

(function initDates(){
  const d = new Date();
  const iso = n => new Date(d.getTime() + n*864e5).toISOString().slice(0,10);
  const t = todayISO();
  // 기본값 + 과거 날짜 선택 방지(min)
  [['stay-in',iso(1)],['stay-out',iso(2)],['dom-date',iso(1)],['intl-date',iso(1)],['intl-return',iso(5)]]
    .forEach(([id,v]) => { const el=$(id); if(el){ el.value=v; el.min=t; } });
  // 체크인 바뀌면 체크아웃 최소값도 갱신
  $('stay-in').addEventListener('change', () => {
    const ci=$('stay-in').value; $('stay-out').min = ci || t;
    if($('stay-out').value <= ci){ const nx=new Date(new Date(ci).getTime()+864e5).toISOString().slice(0,10); $('stay-out').value=nx; }
  });
  $('intl-date').addEventListener('change', () => {
    const dp=$('intl-date').value; $('intl-return').min = dp || t;
    if($('intl-return').value < dp) $('intl-return').value = dp;
  });
})();

function renderMd(txt){
  if(!txt) return '';
  return txt
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(⭐[\d.]+)/g,'<span class="star">$1</span>')
    .replace(/([\d,]+원(?:\/박)?)/g,'<span class="price">$1</span>');
}

async function callMrt(tool, args){
  const res = await fetch('/api/mrt', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ tool, arguments: args })
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || '검색 실패');
  return data;
}
let _ttBusy = false;
function ttLockBtns(lock){
  _ttBusy = lock;
  document.querySelectorAll('.tt-btn').forEach(b => { b.disabled = lock; });
}
function scrollToResults(){
  const el = $('tt-results');
  if(el && window.innerWidth <= 900) el.scrollIntoView({ behavior:'smooth', block:'start' });
}
function ttLoading(m){ $('tt-results').innerHTML = `<div class="tt-loading"><div class="tt-spin"></div>${esc(m||'검색 중...')}</div>`; scrollToResults(); }
let _lastRun = null;  // 마지막 검색 함수 (재시도용)
function ttError(m){
  const retry = _lastRun ? `<br><button class="tt-retry" onclick="if(_lastRun)_lastRun()">🔄 다시 시도</button>` : '';
  $('tt-results').innerHTML = `<div class="tt-err">⚠️ ${esc(m)}<br><small>잠시 후 다시 시도하거나 조건을 바꿔보세요.</small>${retry}</div>`;
}
/* ── 마이리얼트립 위젯(서버구동 UI 트리) → 구조화 카드 파싱 ──
   각 ListViewItem 카드에서 이미지·제목·평점·가격·뱃지·예약URL 추출 */
function parseWidgetCards(widget){
  const cards = (widget && widget.children) || [];
  const out = [];
  for(const c of cards){
    const it = { img:'', url:'', rating:'', rcount:'', price:'', title:'', badges:[], metas:[] };
    (function walk(o){
      if(o == null || typeof o !== 'object') return;
      if(o.type === 'Image' && (o.url || o.src) && !it.img) it.img = o.url || o.src;
      if(o.type === 'Badge' && o.label) it.badges.push(o.label);
      if(o.type === 'Text' && o.value){
        const v = String(o.value).trim();
        if(/⭐/.test(v)){
          const m = v.match(/([\d.]+)\s*\(([\d,]+)\)/);
          if(m){ it.rating = m[1]; it.rcount = m[2]; }
          else { const n = v.match(/([\d.]+)/); if(n) it.rating = n[1]; }
        } else if(/[\d,]+\s*원/.test(v)){
          if(!it.price) it.price = v;
        } else {
          if(!it.title) it.title = v; else it.metas.push(v);
        }
      }
      if(o.onClickAction && !it.url){
        it.url = o.onClickAction?.payload?.target?.url || o.onClickAction?.url || '';
      }
      for(const k in o) walk(o[k]);
    })(c);
    if(it.title || it.img) out.push(it);
  }
  return out;
}
// copy_text에서 전체 개수 추출 ("총 657개 중 20개 표시")
function extractTotal(txt){
  const m = String(txt || '').match(/총\s*([\d,]+)\s*개/);
  return m ? Number(m[1].replace(/,/g,'')) : 0;
}

// 결과 카드 상태 (페이지네이션)
let _ttItems = [], _ttPage = 1, _ttTotal = 0;
const _TT_PAGE_SIZE = 5;

function itemCard(it){
  const badges = (it.badges || []).slice(0,2).map(b => `<span class="tt-badge">${esc(b)}</span>`).join('');
  const rate = it.rating
    ? `<span class="tt-rate">⭐ ${esc(it.rating)}${it.rcount ? ` <small>(${esc(it.rcount)})</small>` : ''}</span>` : '';
  const meta = (it.metas || []).slice(0,1).map(m => `<span class="tt-mloc">${esc(m)}</span>`).join('');
  const price = it.price ? `<span class="tt-price2">${esc(it.price)}</span>` : '<span></span>';
  const thumb = it.img
    ? `<div class="tt-thumb"><img src="${esc(it.img)}" alt="" loading="lazy"></div>`
    : `<div class="tt-thumb tt-thumb-none">🎫</div>`;
  const inner =
    `${thumb}<div class="tt-info">` +
      (badges ? `<div class="tt-badges">${badges}</div>` : '') +
      `<h3 class="tt-title2">${esc(it.title || '상품')}</h3>` +
      `<div class="tt-metarow">${rate}${meta}</div>` +
      `<div class="tt-pricerow">${price}${it.url ? '<span class="tt-book">예약 ↗</span>' : ''}</div>` +
    `</div>`;
  return it.url
    ? `<a class="tt-item" href="${esc(affLink(it.url))}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="tt-item">${inner}</div>`;
}

function renderItemsPage(scroll){
  const grid = $('tt-grid'), pager = $('tt-pager'), head = $('tt-items-head');
  if(!grid) return;
  const size = _TT_PAGE_SIZE, total = _ttItems.length;
  const pages = Math.max(1, Math.ceil(total / size));
  _ttPage = Math.min(Math.max(1, _ttPage), pages);
  const start = (_ttPage - 1) * size;
  grid.innerHTML = _ttItems.slice(start, start + size).map(itemCard).join('');
  if(head){
    const totalStr = _ttTotal >= 10000 ? '10,000+' : _ttTotal.toLocaleString();
    const totalTxt = _ttTotal ? `총 <b>${totalStr}</b>개 중 상위 ${total}개` : `${total}개`;
    head.innerHTML = `<span>🎫 ${totalTxt}</span><span>${_ttPage} / ${pages} 페이지</span>`;
  }
  pager.innerHTML = renderPager(pages);
  if(scroll){ const box = $('tt-results'); if(box) box.scrollIntoView({ behavior:'smooth', block:'start' }); }
}
function renderPager(pages){
  if(pages <= 1) return '';
  let btns = `<button class="tt-page-btn" ${_ttPage===1?'disabled':''} onclick="ttGoPage(${_ttPage-1})">‹</button>`;
  for(let p=1; p<=pages; p++){
    btns += `<button class="tt-page-btn ${p===_ttPage?'active':''}" onclick="ttGoPage(${p})">${p}</button>`;
  }
  btns += `<button class="tt-page-btn" ${_ttPage===pages?'disabled':''} onclick="ttGoPage(${_ttPage+1})">›</button>`;
  return btns;
}
function ttGoPage(p){ _ttPage = p; renderItemsPage(true); }

function ttShow(data, ctaUrl, ctaLabel, partnerQuery, partnerType){
  const cards = data.data && data.data.widget ? parseWidgetCards(data.data.widget) : [];
  let inner;
  if(cards.length){
    _ttItems = cards; _ttPage = 1; _ttTotal = extractTotal(data.copyText);
    inner = `<div class="tt-items-head" id="tt-items-head"></div>` +
            `<div class="tt-grid" id="tt-grid"></div>` +
            `<div class="tt-pager" id="tt-pager"></div>`;
  } else {
    const text = data.copyText || data.text;
    if(text) inner = `<div class="tt-card">${renderMd(text)}</div>`;
    else if(data.data) inner = `<div class="tt-card">${summarize(data.data)}</div>`;
    else inner = `<div class="tt-err">표시할 결과가 없습니다.</div>`;
  }
  if(ctaUrl) inner += `<a class="tt-cta" href="${affLink(ctaUrl)}" target="_blank" rel="noopener">${ctaLabel} ↗</a>`;
  // 타 플랫폼 비교 딥링크 (투어·티켓/숙소일 때만)
  if(partnerQuery && partnerType){
    const ctas = partnerCtas(partnerQuery, partnerType);
    if(ctas) inner += `<p class="tt-compare-lbl">💰 다른 플랫폼 가격 비교</p>` + ctas;
  }
  $('tt-results').innerHTML = inner;
  if(cards.length) renderItemsPage(false);
  scrollToResults();
}
function summarize(d){
  const list = d.products || d.stays || [];
  if(!list.length) return '검색 결과가 없습니다. 다른 조건으로 시도해보세요.';
  return list.slice(0,5).map((p,i)=>{
    const name = esc(p.title||p.name||p.productName||'(이름 없음)');
    const price = p.priceFrom||p.price||p.lowestPrice||'';
    const rating = p.rating||p.reviewScore||'';
    const priceNum = Number(String(price).replace(/[^\d.]/g,''));
    return `${i+1}. <strong>${name}</strong>`+(rating?` <span class="star">⭐${esc(rating)}</span>`:'')+(price&&priceNum?`\n   <span class="price">${priceNum.toLocaleString()}원~</span>`:'');
  }).join('\n');
}

// 항공편 결과 상태 (정렬용)
let _lastFlights = null;
let _flightSort = 'price';

function _flightPrice(f){ return f.price?.total || f.outbound?.legPrice || 0; }
function _flightDepMin(f){ const t=f.outbound?.departTime||'99:99'; const [h,m]=t.split(':').map(Number); return (h||0)*60+(m||0); }
function _flightDur(f){ return f.outbound?.durationMinutes || 0; }

function sortFlights(mode){ _flightSort = mode; if(_lastFlights) ttShowFlights(_lastFlights); }

// 항공편 결과 카드 렌더 (data.result.items)
function renderFlights(d){
  const res = d.data?.result || {};
  let items = (res.items || []).slice();
  if(!items.length) return `<div class="tt-err">검색된 항공편이 없습니다.<br><small>날짜나 노선을 바꿔 다시 시도해보세요.</small></div>`;
  // 클라이언트 정렬
  const cmp = { price:(a,b)=>_flightPrice(a)-_flightPrice(b), depart:(a,b)=>_flightDepMin(a)-_flightDepMin(b), duration:(a,b)=>_flightDur(a)-_flightDur(b) };
  items.sort(cmp[_flightSort] || cmp.price);
  const fmtDur = m => m ? `${Math.floor(m/60)}시간 ${String(m%60).padStart(2,'0')}분` : '';
  const cheapest = res.summary?.cheapestTotal;
  const opt = (v,l)=>`<option value="${v}"${_flightSort===v?' selected':''}>${l}</option>`;
  let html = `<div class="tt-flight-head"><span>✈ 총 ${res.summary?.totalOutbound ?? items.length}편 중 ${items.length}편` +
             (cheapest?` · 최저 <span class="price">${Number(cheapest).toLocaleString()}원</span>`:'') + `</span>` +
             `<select class="tt-sort" onchange="sortFlights(this.value)">${opt('price','가격 낮은순')}${opt('depart','출발 빠른순')}${opt('duration','소요 짧은순')}</select></div>`;
  html += items.slice(0,10).map(f => {
    const air = esc(f.airline?.name || airlineName(f.airline?.code));
    const ob = f.outbound || {};
    const ib = f.inbound || null;
    const price = _flightPrice(f);
    const url = f.reservationUrl ? esc(f.reservationUrl) : '';
    const badge = f.isCheapest ? `<span class="tt-flight-badge">최저가</span>` : '';
    const legLine = (leg, label) => leg ? `<div class="tt-flight-leg"><span class="tt-leg-tag">${label}</span> ${esc(leg.departCity||'')} <b>${esc(leg.departTime||'')}</b> → ${esc(leg.arriveCity||'')} <b>${esc(leg.arriveTime||'')}</b> <span class="tt-leg-dur">${fmtDur(leg.durationMinutes)}</span></div>` : '';
    const inner =
      `<div class="tt-flight-top"><span class="tt-flight-air">${air} <span class="tt-flight-no">${esc(ob.flightNumber||'')}</span></span>${badge}<span class="tt-flight-price">${Number(price).toLocaleString()}원</span></div>` +
      legLine(ob, ib?'가는편':'') +
      legLine(ib, '오는편');
    return url
      ? `<a class="tt-flight-card" href="${url}" target="_blank" rel="noopener">${inner}<span class="tt-flight-cta">예약하기 ↗</span></a>`
      : `<div class="tt-flight-card">${inner}</div>`;
  }).join('');
  return html;
}

// 날짜별 최저가 캘린더 렌더 (flightsFareCalendar)
function renderFareCalendar(d){
  const res = d.data?.result || {};
  const items = (res.items || []).slice().sort((a,b)=>a.totalPrice-b.totalPrice);
  if(!items.length) return `<div class="tt-err">날짜별 최저가 데이터가 없습니다.</div>`;
  const cheap = res.cheapest;
  let html = `<div class="tt-fare-notice">📅 <strong>날짜별 최저가</strong> — 이 가격은 <u>실시간이 아니며</u> 예약 시점에 변동될 수 있습니다.</div>`;
  if(cheap) html += `<div class="tt-fare-best">🏆 최저가 <span class="price">${Number(cheap.totalPrice).toLocaleString()}원</span> · ${esc(cheap.departureDate)} ~ ${esc(cheap.returnDate)} (${esc(airlineName(cheap.airline))})</div>`;
  html += `<div class="tt-fare-grid">` + items.slice(0,12).map(it => {
    const dep = esc(it.departureDate), ret = esc(it.returnDate);
    return `<button class="tt-fare-cell" onclick="applyFareDate('${dep}','${ret}')">
      <span class="tt-fare-date">${dep.slice(5)} → ${ret.slice(5)}</span>
      <span class="tt-fare-price">${Number(it.totalPrice).toLocaleString()}원</span>
      <span class="tt-fare-air">${esc(airlineName(it.airline))}</span>
    </button>`;
  }).join('') + `</div>`;
  html += `<p class="tt-compare-lbl" style="margin-top:14px">날짜를 누르면 위 검색 폼에 자동 입력됩니다</p>`;
  return html;
}
function applyFareDate(dep, ret){
  $('intl-date').value = dep; $('intl-return').value = ret;
  $('intl-date').scrollIntoView({ behavior:'smooth', block:'center' });
  ttRunIntl();
}

async function ttRunTna(){
  if(_ttBusy) return;
  const q = $('tna-q').value.trim(); if(!q){ $('tna-q').focus(); return; }
  _lastRun=ttRunTna; ttLockBtns(true); ttLoading('투어·티켓 검색 중...');
  try{
    const data = await callMrt('searchTnas', { query:q, perPage:8, sort:$('tna-sort').value });
    ttShow(data, 'https://www.myrealtrip.com/search?q=' + encodeURIComponent(q), '마이리얼트립에서 전체 보기', q, 'tna');
    saveHist({ tab:'tna', label:'🎟 '+q, fields:{'tna-q':q} });
  }catch(e){ ttError(e.message); }
  finally{ ttLockBtns(false); }
}
async function ttRunStay(){
  if(_ttBusy) return;
  const q = $('stay-q').value.trim(); if(!q){ $('stay-q').focus(); return; }
  const ci = $('stay-in').value, co = $('stay-out').value;
  if(ci && co && co <= ci){ ttError('체크아웃 날짜는 체크인보다 뒤여야 합니다.'); return; }
  _lastRun=ttRunStay; ttLockBtns(true); ttLoading('숙소 검색 중...');
  try{
    const data = await callMrt('searchStays', {
      keyword:q, checkIn:ci, checkOut:co,
      adultCount:Number($('stay-adult').value), childCount:0, isDomestic:$('stay-domestic').value==='true'
    });
    ttShow(data, 'https://www.myrealtrip.com/accommodations?keyword=' + encodeURIComponent(q), '마이리얼트립에서 예약하기', q, 'stay');
    saveHist({ tab:'stay', label:'🏨 '+q, fields:{'stay-q':q} });
  }catch(e){ ttError(e.message); }
  finally{ ttLockBtns(false); }
}
async function ttRunDom(){
  if(_ttBusy) return;
  const from=$('dom-from').value, to=$('dom-to').value;
  if(from===to){ ttError('출발지와 도착지가 같습니다.'); return; }
  _lastRun=ttRunDom; ttLockBtns(true); ttLoading('국내 항공권 검색 중...');
  try{
    const data = await callMrt('searchDomesticFlights', { origin:from, destination:to, departDate:$('dom-date').value, tripType:'ONE_WAY', maxResults:8 });
    ttShowFlights(data);
    saveHist({ tab:'dom', label:`🛫 ${from}→${to}`, fields:{'dom-from':from,'dom-to':to,'dom-date':$('dom-date').value} });
  }catch(e){ ttError(e.message); }
  finally{ ttLockBtns(false); }
}
async function ttRunIntl(){
  if(_ttBusy) return;
  const from=$('intl-from').value, to=$('intl-to').value;
  const dep=$('intl-date').value, ret=$('intl-return').value;
  if(ret && dep && ret < dep){ ttError('오는 날은 가는 날 이후여야 합니다.'); return; }
  _lastRun=ttRunIntl; ttLockBtns(true); ttLoading('국제 항공권 검색 중...');
  try{
    const data = await callMrt('searchInternationalFlights', {
      tripType:'ROUND_TRIP', origin:from, destination:to,
      departDate:dep, returnDate:ret,
      passengers:{adults:1,children:0,infants:0}, maxResults:6
    });
    ttShowFlights(data);
    saveHist({ tab:'intl', label:`🌏 ${from}→${to}`, fields:{'intl-from':from,'intl-to':to,'intl-date':dep,'intl-return':ret} });
  }catch(e){ ttError(e.message); }
  finally{ ttLockBtns(false); }
}
