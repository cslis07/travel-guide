<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="트래블코스트 내 여행 — 여행마다 일정·예산·예약·준비물·공항을 하나로 관리하세요.">
  <title>내 여행 | 트래블코스트</title>
  <link rel="canonical" href="https://travelcost.co.kr/trips">
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <meta name="mobile-web-app-capable" content="yes">
<style>
  body{background:var(--gray-50)}
  .tw{max-width:640px;margin:0 auto;padding:0 16px 40px}
  .tw-head{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 8px}
  .tw-head h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .tw-head .sub{font-size:12.5px;color:var(--gray-500);font-weight:600;margin-top:2px}
  .newbtn{border:none;background:var(--primary);color:#fff;border-radius:14px;padding:11px 15px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow)}
  .filters{display:flex;gap:7px;margin:6px 0 16px}
  .fchip{padding:7px 13px;border-radius:999px;border:1px solid var(--gray-200);background:var(--surface,#fff);font-size:12.5px;font-weight:700;color:var(--gray-600);cursor:pointer}
  .fchip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .tcard{border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);background:var(--surface,#fff);cursor:pointer;transition:transform .12s,box-shadow .12s;margin-bottom:16px}
  .tcard:active{transform:scale(.99)}
  .tcover.ph{height:170px;background-size:cover;background-position:center}
  .tcover{height:130px;position:relative;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
  .cov-blue{background:linear-gradient(135deg,#1B4FD8,#0ea5e9)} .cov-osaka{background:linear-gradient(135deg,#f97316,#e5484d)}
  .cov-purple{background:linear-gradient(135deg,#7c3aed,#1B4FD8)} .cov-green{background:linear-gradient(135deg,#039855,#22c55e)}
  .cov-pink{background:linear-gradient(135deg,#db2777,#f97316)}
  .dday{align-self:flex-start;background:rgba(255,255,255,.24);backdrop-filter:blur(6px);padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800}
  .tdel{position:absolute;top:12px;right:12px;width:32px;height:32px;border:none;border-radius:10px;background:rgba(0,0,0,.28);backdrop-filter:blur(6px);color:#fff;font-size:14px;cursor:pointer;line-height:1;z-index:2}
  .tdel:active{background:rgba(0,0,0,.45)}
  .tcopy{position:absolute;top:12px;right:52px;height:32px;padding:0 10px;border:none;border-radius:10px;background:rgba(0,0,0,.28);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:800;cursor:pointer;z-index:2;font-family:inherit}
  .tcover h3{font-size:22px;font-weight:800;text-shadow:0 1px 10px rgba(0,0,0,.22)}
  .tcover .dt{font-size:12.5px;font-weight:600;opacity:.96}
  .tbar{padding:0 14px}.tbar .pr{height:6px;border-radius:999px;background:var(--gray-100);overflow:hidden;margin-top:12px}
  .tbar .pr i{display:block;height:100%;background:var(--primary);border-radius:999px}
  .tmeta{padding:11px 14px;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--gray-600);font-weight:600}
  .avz{margin-left:auto;display:flex}.avz span{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-left:-7px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
  .empty{text-align:center;padding:60px 20px;color:var(--gray-500)}
  .empty .em{font-size:44px}.empty h3{font-size:16px;color:var(--gray-700);margin:10px 0 4px}.empty p{font-size:13px}
  .sech{font-size:12px;font-weight:800;color:var(--gray-500);letter-spacing:.02em;margin:8px 2px 10px;text-transform:uppercase}
  /* 모달 */
  .mwrap{position:fixed;inset:0;background:rgba(16,24,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:1000}
  .mwrap.on{display:flex}
  .tw-head>div:first-child{flex:1}
  .bkbtn{border:1px solid var(--gray-200);background:var(--surface,#fff);color:var(--gray-700);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:800;margin-right:8px;cursor:pointer;font-family:inherit}
  .bk-p{font-size:13px;color:var(--gray-600);line-height:1.6;margin:4px 0 10px}.bk-last{font-size:12.5px;font-weight:700;color:var(--primary);margin-bottom:8px}
  .bk-chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;min-height:40px}.bk-chk small{font-weight:500;color:var(--gray-500)}
  .bk-restore{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:8px;border:1.5px dashed var(--gray-300);border-radius:14px;font-size:14px;font-weight:800;color:var(--primary);cursor:pointer}
  .bk-note{font-size:11.5px;color:var(--gray-500);margin-top:10px;line-height:1.5}
  .bk-banner{display:flex;align-items:center;gap:10px;background:#FFFAEB;border:1px solid #FEDF89;border-radius:14px;padding:11px 13px;margin-bottom:14px}
  .bk-banner span{font-size:20px}.bk-banner div{flex:1;font-size:12.5px;color:#93370D}.bk-banner small{display:block;color:#B54708}
  .bk-banner button{border:none;background:#B54708;color:#fff;font-weight:800;font-size:12.5px;padding:8px 12px;border-radius:10px;cursor:pointer;font-family:inherit}
  #bk-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#101828;color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:3000;pointer-events:none;max-width:88vw;text-align:center}#bk-toast.on{opacity:1}
  .modal{background:var(--surface,#fff);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 18px 28px;animation:up .25s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow-y:auto}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .grip{width:38px;height:4px;background:var(--gray-200);border-radius:999px;margin:0 auto 14px}
  .modal h3{font-size:18px;font-weight:800;margin-bottom:14px}
  label.fl{display:block;font-size:12.5px;font-weight:700;color:var(--gray-600);margin:12px 0 5px}
  .in{width:100%;padding:12px 13px;border:1px solid var(--gray-200);border-radius:12px;font-size:14px;font-family:inherit;background:var(--gray-50)}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  .covpick{display:flex;gap:8px;margin-top:4px}
  .covpick i{width:34px;height:34px;border-radius:10px;cursor:pointer;border:2px solid transparent}
  .covpick i.on{border-color:var(--gray-800);transform:scale(1.08)}
  .save{width:100%;padding:14px;border:none;border-radius:14px;background:var(--primary);color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:18px}
  svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="tw">
  <div class="tw-head">
    <div><h1>내 여행</h1><div class="sub" id="subCount"></div></div>
    <button class="bkbtn" onclick="openBackup()" aria-label="백업·복원">📦 백업</button>
    <button class="newbtn" onclick="openNew()"><svg class="i" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>새 여행</button>
  </div>
  <div class="filters">
    <span class="fchip on" data-f="upcoming" onclick="setF(this)">예정</span>
    <span class="fchip" data-f="past" onclick="setF(this)">지난 여행</span>
    <span class="fchip" data-f="all" onclick="setF(this)">전체</span>
  </div>
  <div id="list"></div>
</div>

<!-- 백업·복원 -->
<div class="mwrap" id="bkModal"><div class="modal">
  <div class="grip"></div>
  <h3>백업 · 복원</h3>
  <p class="bk-p">여행·지출·준비물은 <b>이 폰의 브라우저에만</b> 저장돼요. 브라우저 데이터를 지우거나 폰을 바꾸면 사라지니, 백업 파일을 카톡 '나와의 채팅'·드라이브 등에 보관하세요.</p>
  <div class="bk-last" id="bkLast"></div>
  <label class="bk-chk"><input type="checkbox" id="bkRc" checked> 영수증 사진도 넣기 <small id="bkRcN"></small></label>
  <button class="save" onclick="doBackup()">📥 백업 파일 저장</button>
  <label class="bk-restore">📤 백업 파일에서 복원<input type="file" id="bkFile" accept=".json,application/json" hidden onchange="doRestore(this)"></label>
  <p class="bk-note">복원은 덮어쓰지 않고 <b>합쳐요</b> — 없는 여행은 추가, 같은 여행이 내용만 다르면 '(복원)' 사본으로 추가, 똑같으면 건너뜀.</p>
</div></div>

<!-- 새 여행 모달 -->
<div class="mwrap" id="newModal">
  <div class="modal">
    <div class="grip"></div>
    <h3>새 여행 만들기</h3>
    <label class="fl" for="f-city">어디로 가세요?</label>
    <input class="in" id="f-city" placeholder="예: 오사카, 다낭, 강릉">
    <div class="row2">
      <div><label class="fl" for="f-start">출발일</label><input class="in" id="f-start" type="date"></div>
      <div><label class="fl" for="f-end">도착일</label><input class="in" id="f-end" type="date"></div>
    </div>
    <label class="fl" for="f-budget">총예산 (원, 선택)</label>
    <input class="in" id="f-budget" type="number" inputmode="numeric" placeholder="예: 1200000">
    <a href="/estimate" style="display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--primary);text-decoration:none">🧮 얼마 들지 모르겠다면 — 경비 계산으로 예산 잡기 ›</a>
    <div class="row2">
      <div><label class="fl" for="f-ppl">인원</label><input class="in" id="f-ppl" type="number" inputmode="numeric" value="1" min="1"></div>
      <div><label class="fl">커버 색</label>
        <div class="covpick" id="covpick">
          <i class="cov-osaka on" data-c="osaka"></i><i class="cov-blue" data-c="blue"></i>
          <i class="cov-purple" data-c="purple"></i><i class="cov-green" data-c="green"></i><i class="cov-pink" data-c="pink"></i>

      </div>

    <button class="save" onclick="createTrip()">여행 만들기</button>

<script src="/trips.js"></script>
<script src="/trip-attach.js"></script>
<script>
var T = window.TripStore; T.seedIfEmpty();
var curF = 'upcoming', curCover = 'osaka';

/* ── 구 mytrip 데이터 이관(찜·편명·나만의 준비물) ── */
function jget(k,d){ try{ return JSON.parse(localStorage.getItem(k)||d); }catch(e){ return JSON.parse(d); } }
function legacyPayload(){
  var saved=jget('tripguide_saved_places','[]'), flights=jget('icn_fav_flights','[]');
  var custom=jget('icn_checklist_custom','[]'), state=jget('icn_checklist','{}');
  var itinerary=(saved||[]).map(function(p){ return {type:'sight',title:p.title||'저장한 장소',memo:p.addr1||''}; });
  var checklist=(custom||[]).map(function(c){ return {group:'나만의 준비물',text:c.text||'',when:'',done:!!state[c.id]}; }).filter(function(c){return c.text;});
  var reservations=(flights||[]).map(function(f){ return {type:'flight',title:f.flightId||'항공편',detail:(f.dir==='dep'?'출발편':'도착편'),status:'planned'}; });
  var dep=(flights||[]).filter(function(f){return f.dir==='dep';})[0]||(flights||[])[0], flight=null;
  if(dep) flight={no:dep.flightId||'',airline:'',from:'ICN',to:'',dep:'',arr:'',date:'',terminal:'미정'};
  var count=(saved||[]).length+(flights||[]).length+checklist.length;
  return { count:count, payload:{label:'이전 내 여행 데이터 가져오기', itinerary:itinerary, checklist:checklist, reservations:reservations, flight:flight} };
}
function legacyBannerHtml(){
  if(localStorage.getItem('tc_legacy_migrated')) return '';
  var lp=legacyPayload(); if(lp.count<=0) return '';
  window.__legacyPayload=lp.payload;
  return '<div id="legacyBanner" style="display:flex;align-items:center;gap:10px;background:var(--accent-lt);'
    +'border:1px solid #f6c99a;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;color:#7c3a00">'
    +'<span style="font-size:20px">🗂️</span>'
    +'<div style="flex:1;font-weight:700">이전에 저장한 찜·편명·준비물 '+lp.count+'개가 있어요<br><span style="font-weight:500;color:#9a5a20">여행 하나로 가져올 수 있습니다</span></div>'
    +'<button onclick="importLegacy()" style="border:none;background:var(--accent);color:#fff;font-weight:800;font-size:12px;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap">가져오기</button>'
    +'<span onclick="dismissLegacy()" style="cursor:pointer;color:#b06a2a;font-weight:800;padding:4px">✕</span></div>';
}

/* ═══ 백업·복원 — 서버가 없어 데이터가 이 폰 브라우저에만 있음. 파일로 보관/복원(합치기) ═══ */
var BK_KEYS=['icn_fav_flights','icn_checklist','icn_checklist_custom','tripguide_prepare_done','tripguide_depart_date'];
/* IndexedDB는 연결을 꼭 닫고(안 닫으면 다른 탭·삭제가 막힘), 응답이 없어도 4초 뒤엔 넘어가 백업·복원이 멈추지 않게 */
function once(cb,v){ var done=false, t=setTimeout(function(){ if(!done){ done=true; cb(v); } },4000); return function(x){ if(!done){ done=true; clearTimeout(t); cb(x); } }; }
function rcAll(cb){   // 영수증(IndexedDB) 전부 {id:dataUrl}
  cb=once(cb,{}); if(!window.indexedDB) return cb({});
  try{ var rq=indexedDB.open('tc-receipts',1); rq.onupgradeneeded=function(){ rq.result.createObjectStore('r'); };
    rq.onsuccess=function(){ var db=rq.result, out={}, cur=db.transaction('r').objectStore('r').openCursor();
      cur.onsuccess=function(e){ var c=e.target.result; if(c){ out[c.key]=c.value; c.continue(); } else { db.close(); cb(out); } }; cur.onerror=function(){ db.close(); cb(out); }; };
    rq.onerror=rq.onblocked=function(){ cb({}); }; }catch(e){ cb({}); }
}
function rcPutAll(map,cb){
  cb=once(cb,0); var ids=Object.keys(map||{}); if(!ids.length||!window.indexedDB) return cb(0);
  try{ var rq=indexedDB.open('tc-receipts',1); rq.onupgradeneeded=function(){ rq.result.createObjectStore('r'); };
    rq.onsuccess=function(){ var db=rq.result, tx=db.transaction('r','readwrite'), st=tx.objectStore('r'), n=0;
      ids.forEach(function(id){ var v=map[id]; if(typeof v==='string'&&/^data:image\/jpeg;base64,/.test(v)&&v.length<3e6){ st.put(v,id); n++; } });
      tx.oncomplete=function(){ db.close(); cb(n); }; tx.onerror=tx.onabort=function(){ db.close(); cb(0); }; };
    rq.onerror=rq.onblocked=function(){ cb(0); }; }catch(e){ cb(0); }
}
function lastBackupText(){
  var t=+(localStorage.getItem('tc_last_backup')||0); if(!t) return '아직 백업한 적이 없어요';
  var d=Math.floor((Date.now()-t)/864e5); return '마지막 백업: '+(d?d+'일 전':'오늘')+' ('+new Date(t).toLocaleDateString('ko-KR')+')';
}
function openBackup(){
  document.getElementById('bkLast').textContent=lastBackupText();
  var n=0; T.all().forEach(function(t){ (t.expenses||[]).forEach(function(e){ if(e.hasReceipt) n++; }); });
  document.getElementById('bkRcN').textContent=n?'('+n+'장 — 파일이 커져요)':'(사진 없음)';
  document.getElementById('bkModal').classList.add('on');
}
function closeBackup(){ document.getElementById('bkModal').classList.remove('on'); }
document.getElementById('bkModal').addEventListener('click',function(e){ if(e.target===this) closeBackup(); });
function doBackup(){
  var withRc=document.getElementById('bkRc').checked;
  var extra={}; BK_KEYS.forEach(function(k){ var v=localStorage.getItem(k); if(v!=null) extra[k]=v; });
  (withRc?rcAll:function(cb){ cb({}); })(function(rc){
    var data={ app:'travelcost', v:1, exported:new Date().toISOString(), trips:T.all(), receipts:rc, extra:extra };
    var d=new Date(), name='travelcost-backup-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';
    var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    var done=function(){ localStorage.setItem('tc_last_backup',String(Date.now())); closeBackup(); render(); toastB('백업 파일을 저장했어요 — 안전한 곳에 보관하세요'); };
    try{ var f=new File([blob],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:'트래블코스트 백업'}).then(done).catch(function(){}); return; } }catch(e){}
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },60000); done();   // 너무 빨리 해제하면 큰 백업(영수증 포함) 다운로드가 끊길 수 있음
  });
}
function doRestore(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;   // 입력칸 비우기는 다 읽은 뒤에(먼저 비우면 파일을 못 읽는 브라우저가 있음)
  if(f.size>60e6){ alert('파일이 너무 커요.'); return; }
  var r=new FileReader();
  r.onerror=function(){ inp.value=''; alert('파일을 읽지 못했어요. 다시 골라 주세요.'); };
  r.onload=function(){
    inp.value='';
    var data; try{ data=JSON.parse(r.result); }catch(e){ alert('백업 파일을 읽지 못했어요.'); return; }
    if(!data||data.app!=='travelcost'||!Array.isArray(data.trips)){ alert('트래블코스트 백업 파일이 아니에요.'); return; }
    var mine={}; T.all().forEach(function(t){ mine[t.id]=t; });
    var added=0, copied=0, same=0;
    data.trips.forEach(function(t){
      if(!t||typeof t!=='object'||!t.id||!t.city||!/^\d{4}-\d{2}-\d{2}$/.test(t.start||'')||!/^\d{4}-\d{2}-\d{2}$/.test(t.end||'')) return;
      var cur=mine[t.id];
      if(!cur){ T.upsert(t); added++; return; }
      if(JSON.stringify(cur)===JSON.stringify(t)){ same++; return; }
      var c=JSON.parse(JSON.stringify(t)); c.id='r'+Math.random().toString(36).slice(2,11); c.city=String(t.city).slice(0,30)+' (복원)'; T.upsert(c); copied++;
    });
    Object.keys(data.extra||{}).forEach(function(k){ if(BK_KEYS.indexOf(k)>-1&&localStorage.getItem(k)==null&&typeof data.extra[k]==='string') localStorage.setItem(k,data.extra[k]); });
    rcPutAll(data.receipts,function(n){
      closeBackup(); render();
      alert('복원했어요 — 새 여행 '+added+'개'+(copied?', 사본 '+copied+'개':'')+(same?', 이미 있음 '+same+'개':'')+(n?', 영수증 '+n+'장':''));
    });
  };
  r.readAsText(f);
}
function backupBannerHtml(){
  var list=T.all(); if(!list.length) return '';
  var t=+(localStorage.getItem('tc_last_backup')||0), old=!t||(Date.now()-t)>14*864e5;
  if(!old) return '';
  return '<div class="bk-banner"><span>📦</span><div><b>여행 데이터는 이 폰에만 저장돼요</b><small>'+lastBackupText()+'</small></div><button onclick="openBackup()">백업</button></div>';
}
function toastB(m){ var t=document.getElementById('bk-toast'); if(!t){ t=document.createElement('div'); t.id='bk-toast'; document.body.appendChild(t); } t.textContent=m; t.classList.add('on'); clearTimeout(toastB._t); toastB._t=setTimeout(function(){ t.classList.remove('on'); },2600); }

function importLegacy(){ localStorage.setItem('tc_legacy_migrated','1'); window.TripAttach.open(window.__legacyPayload); }
function dismissLegacy(){ localStorage.setItem('tc_legacy_migrated','1'); var b=document.getElementById('legacyBanner'); if(b) b.remove(); }

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function won(n){return '₩' + (n||0).toLocaleString('ko-KR');}

function classify(t){
  var end = T.daysBetween(T.iso ? T.iso() : new Date().toISOString().slice(0,10), t.end);
  return end < 0 ? 'past' : 'upcoming';
}
function setF(el){ document.querySelectorAll('.fchip').forEach(function(c){c.classList.remove('on');}); el.classList.add('on'); curF = el.dataset.f; render(); }
function delTrip(id){
  var t=T.get(id); if(!t) return;
  if(!confirm('“'+t.city+'” 여행을 삭제할까요?\n일정·예산·예약·준비물이 모두 지워지며 되돌릴 수 없습니다.')) return;
  // 이 여행 지출에 붙은 영수증 사진(IndexedDB)도 함께 지움 — 안 그러면 폰에 계속 남음
  var rc=(t.expenses||[]).filter(function(e){return e.hasReceipt;}).map(function(e){return e.id;});
  if(window.indexedDB){
    try{ var rq=indexedDB.open('tc-receipts',1); rq.onupgradeneeded=function(){ rq.result.createObjectStore('r'); };
      rq.onsuccess=function(){ var db=rq.result, tx=db.transaction('r','readwrite'), st=tx.objectStore('r'); rc.forEach(function(id){ st.delete(id); }); st.delete(IDBKeyRange.bound('j:'+id+':','j:'+id+':￿')); tx.oncomplete=tx.onerror=tx.onabort=function(){ db.close(); }; }; }catch(e){}   // 영수증 + 여행 일기 사진(j:여행id:날짜)
  }
  T.remove(id); render();
}
/* 지난 여행을 템플릿으로 — 일정·준비물·사람·예산만 새 날짜로 복사(지출·예약·항공편은 빼고, 준비물은 다시 미체크) */
function copyTrip(id){
  var t=T.get(id); if(!t) return;
  var d=new Date(Date.now()+30*864e5), def=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  var start=(prompt('“'+t.city+'” 여행을 새 날짜로 다시 써요.\n새 출발일 (예: '+def+')', def)||'').trim();
  if(!start) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(start) || isNaN(new Date(start+'T00:00:00'))){ alert('날짜를 2026-12-01 형식으로 적어 주세요.'); return; }
  var len=T.tripLength(t), e=new Date(start+'T00:00:00'); e.setDate(e.getDate()+len-1);
  var end=e.getFullYear()+'-'+('0'+(e.getMonth()+1)).slice(-2)+'-'+('0'+e.getDate()).slice(-2);
  var uid=function(p){ return p+Math.random().toString(36).slice(2,9); };
  var nt=T.create({ city:t.city, cover:t.cover, start:start, end:end,
    members:(t.members||[]).map(function(m){ var o={name:m.name,color:m.color}; if(m.toss) o.toss=m.toss; return o; }),
    budgetTotal:T.budgetTotal(t) });
  if(t.budget&&t.budget.catLimits) nt.budget.catLimits=JSON.parse(JSON.stringify(t.budget.catLimits));
  T.ensureDays(nt);
  (t.days||[]).forEach(function(day,i){ if(nt.days[i]) nt.days[i].items=(day.items||[]).map(function(it){ return { id:uid('i'), time:it.time||'', type:it.type||'sight', title:it.title, memo:it.memo||'' }; }); });
  nt.checklist=(t.checklist||[]).map(function(c){ return { id:uid('c'), group:c.group||'기타', text:c.text, when:c.when||'', done:false }; });
  T.upsert(nt);
  location.href='/trip?id='+nt.id;
}

function render(){
  var list = T.all().sort(function(a,b){ return new Date(a.start)-new Date(b.start); });
  var up = list.filter(function(t){return classify(t)==='upcoming';});
  var past = list.filter(function(t){return classify(t)==='past';});
  document.getElementById('subCount').textContent = list.length + '개의 여행 · 예정 ' + up.length + '개';
  var show = curF==='upcoming'?up : curF==='past'?past : list;
  var el = document.getElementById('list');
  var banner = legacyBannerHtml() + backupBannerHtml();
  if(!show.length){
    el.innerHTML = banner + '<div class="empty"><div class="em">🧳</div><h3>아직 여행이 없어요</h3><p>“새 여행”을 눌러 첫 여행을 만들어 보세요.</p></div>';
    return;
  }
  el.innerHTML = banner + show.map(card).join('');
}
function card(t){
  var pct = T.spentPct(t), done = classify(t)==='past';
  var mem = (t.members||[]).slice(0,3).map(function(m){return '<span style="background:'+m.color+'">'+esc(m.name.slice(0,1))+'</span>';}).join('');
  if((t.members||[]).length>3) mem += '<span style="background:#98A2B3">+'+((t.members.length)-3)+'</span>';
  var budgetLbl = T.budgetTotal(t) ? (pct+'% 사용') : '예산 설정 중';
  var places = (t.days||[]).reduce(function(s,d){return s+((d.items||[]).length);},0);
  var ph = T.cityPhoto ? T.cityPhoto(t.city) : '';   // 도시 사진(가이드 커버) — 없으면 색 그라데이션
  var cst = (ph ? 'background-image:linear-gradient(180deg,rgba(0,0,0,.08) 30%,rgba(0,0,0,.62)),url(\''+ph+'\');' : '') + (done ? 'filter:grayscale(.25)' : '');
  return '<div class="tcard" onclick="location.href=\'/trip?id='+t.id+'\'">'
    + '<div class="tcover cov-'+esc(t.cover)+(ph?' ph':'')+'"'+(cst?' style="'+cst+'"':'')+'>'
    +   '<button class="tdel" title="여행 삭제" aria-label="여행 삭제" onclick="event.stopPropagation();delTrip(\''+t.id+'\')">🗑</button>'
    +   '<button class="tcopy" title="이 여행을 새 날짜로 다시 쓰기" onclick="event.stopPropagation();copyTrip(\''+t.id+'\')">↻ 다시 쓰기</button>'
    +   '<span class="dday"'+(done?' style="background:rgba(0,0,0,.28)"':'')+'>'+T.ddayText(t)+'</span>'
    +   '<div><h3>'+esc(t.city)+'</h3><div class="dt">'+T.fmtMD(t.start)+' – '+T.fmtMD(t.end)+' · '+T.tripLength(t)+'일 · '+(t.members||[]).length+'명</div></div>'
    + '</div>'
    + (T.budgetTotal(t)&&!done?'<div class="tbar"><div class="pr"><i style="width:'+pct+'%"></i></div></div>':'')
    + '<div class="tmeta"><span>📍 일정 '+places+'곳</span><span>💰 '+budgetLbl+'</span><div class="avz">'+mem+'</div></div>'
    + '</div>';
}

/* 새 여행 */
function openNew(){
  var d = new Date(Date.now()+7*864e5), d2 = new Date(Date.now()+9*864e5);
  document.getElementById('f-start').value = d.toISOString().slice(0,10);
  document.getElementById('f-end').value = d2.toISOString().slice(0,10);
  document.getElementById('f-city').value=''; document.getElementById('f-budget').value=''; document.getElementById('f-ppl').value=1;
  document.getElementById('newModal').classList.add('on');
}
document.getElementById('covpick').addEventListener('click',function(e){
  var i=e.target.closest('i'); if(!i)return;
  this.querySelectorAll('i').forEach(function(x){x.classList.remove('on');}); i.classList.add('on'); curCover=i.dataset.c;
});
document.getElementById('newModal').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('on'); });
function createTrip(){
  var city=document.getElementById('f-city').value.trim()||'새 여행';
  var start=document.getElementById('f-start').value, end=document.getElementById('f-end').value;
  if(!start||!end||new Date(end)<new Date(start)){ alert('날짜를 확인해 주세요.'); return; }
  var ppl=Math.max(1,parseInt(document.getElementById('f-ppl').value)||1);
  var members=[{name:'나',color:T.MEMBER_COLORS[0]}];
  for(var i=1;i<ppl;i++) members.push({name:'동행'+i,color:T.MEMBER_COLORS[i%T.MEMBER_COLORS.length]});
  var t=T.create({city:city,cover:curCover,start:start,end:end,budgetTotal:parseInt(document.getElementById('f-budget').value)||0,members:members});
  location.href='/trip?id='+t.id;
}

/* ── 공유 링크(?t=)로 받은 여행 가져오기 ── */
(function importShared(){
  var enc = new URLSearchParams(location.search).get('t');
  if(!enc) return;
  try{
    if(enc.length>600000) throw 0;
    var obj = JSON.parse(decodeURIComponent(escape(atob(enc.replace(/ /g,'+')))));   // 옛 링크: + 가 공백으로 바뀐 것 복구
    if(!obj || !obj.city || !obj.start || !obj.end) throw 0;
    var nt = T.create({ city:obj.city, cover:obj.cover||'blue', start:obj.start, end:obj.end,
      members:(obj.members&&obj.members.length)?obj.members:[{name:'나',color:T.MEMBER_COLORS[0]}],
      budgetTotal:(obj.budget&&obj.budget.total)||0 });
    if(obj.days) nt.days=obj.days;
    nt.expenses=obj.expenses||[]; nt.reservations=obj.reservations||[]; nt.checklist=obj.checklist||[]; nt.flight=obj.flight||null;
    T.upsert(nt);
    history.replaceState({},'', '/trips');
    location.href='/trip?id='+nt.id; return;
  }catch(e){ history.replaceState({},'', '/trips'); }
})();
/* ── 지출 합치기 링크(?x=)로 받은 동행 지출을 같은 여행에 합치기 — 같은 id는 건너뛰고, 없는 사람은 추가 ── */
(function mergeShared(){
  var enc = new URLSearchParams(location.search).get('x');
  if(!enc) return;
  history.replaceState({},'', '/trips');
  var obj;
  try{ if(enc.length>600000) throw 0; obj = JSON.parse(decodeURIComponent(escape(atob(enc.replace(/ /g,'+'))))); }catch(e){ alert('지출 링크를 읽지 못했어요.'); return; }
  if(!obj || !obj.city || !Array.isArray(obj.expenses)) { alert('지출 링크 형식이 올바르지 않아요.'); return; }
  var str = function(v,n){ return String(v==null?'':v).slice(0,n); };
  var num = function(v){ v=+v; return isFinite(v)&&v>=0?v:0; };
  var incoming = obj.expenses.filter(function(e){ return e && e.id && num(e.krw)>0; }).map(function(e){
    return { id:str(e.id,40), date:str(e.date,10), amount:num(e.amount), currency:str(e.currency||'KRW',3), krw:Math.round(num(e.krw)),
      category:str(e.category||'etc',20), method:e.method==='cash'?'cash':'card', paidBy:str(e.paidBy,30),
      paidFor:Array.isArray(e.paidFor)?e.paidFor.map(function(n){return str(n,30);}).filter(Boolean):[], memo:str(e.memo,120) };
  });
  var cands = T.all().filter(function(t){ return t.city===obj.city; });
  var t = cands.filter(function(c){ return c.start===obj.start; })[0] || cands[0];
  if(!t){
    if(!confirm('“'+obj.city+'” 여행이 이 기기에 없어요. 받은 지출로 새 여행을 만들까요?')) return;
    t = T.create({ city:str(obj.city,40), start:obj.start, end:obj.end || obj.start, members:[{name:'나',color:T.MEMBER_COLORS[0]}] });
  }
  var have = {}; (t.expenses||[]).forEach(function(e){ have[e.id]=1; });
  var add = incoming.filter(function(e){ return !have[e.id]; });
  if(!add.length){ alert('합칠 새 지출이 없어요 — 이미 모두 들어 있어요.'); location.href='/trip?id='+t.id+'&tab=budget'; return; }
  if(!confirm('“'+t.city+'” 여행에 동행 지출 '+add.length+'건을 합칠까요?'+(incoming.length>add.length?'\n(이미 있는 '+(incoming.length-add.length)+'건은 건너뜀)':''))) return;
  // 지출에 나오는 사람 중 내 여행에 없는 사람은 멤버로 추가(색은 받은 링크 → 기본 팔레트 순)
  t.members = t.members || [];
  var names = {}; t.members.forEach(function(m){ names[m.name]=1; });
  var colorOf = {}; (obj.members||[]).forEach(function(m){ if(m&&m.name) colorOf[str(m.name,30)] = /^#[0-9a-fA-F]{6}$/.test(m.color)?m.color:''; });
  add.forEach(function(e){ [e.paidBy].concat(e.paidFor).forEach(function(n){
    if(n && !names[n]){ names[n]=1; t.members.push({ name:n, color: colorOf[n] || T.MEMBER_COLORS[t.members.length % T.MEMBER_COLORS.length] }); }
  }); });
  t.expenses = add.concat(t.expenses||[]);
  T.upsert(t);
  location.href='/trip?id='+t.id+'&tab=budget';
})();
render();
</script>
