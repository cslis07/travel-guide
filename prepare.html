.pr-wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}

.stage{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);

.stage.now{border-color:var(--primary);box-shadow:0 0 0 3px rgba(27,79,216,.09)}

.stage.now .stage-head{background:var(--primary-lt)}
.stage-when{flex-shrink:0;width:62px;text-align:center;font-size:.92rem;font-weight:850;

.stage-when small{display:block;font-size:.62rem;font-weight:600;color:var(--gray-500);margin-top:1px}
.stage-title{flex:1;min-width:0}
.stage-title b{display:block;font-size:.98rem;font-weight:750;color:var(--gray-900);letter-spacing:-.02em}
.stage-title span{font-size:.74rem;color:var(--gray-500)}
.stage-badge{font-size:.64rem;font-weight:750;padding:3px 9px;border-radius:999px;
  background:var(--primary);color:#fff;white-space:nowrap}
.stage-body{padding:6px 18px 18px}

.todo{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--gray-100)}
.todo:last-child{border-bottom:none}
.todo input[type=checkbox]{width:19px;height:19px;flex-shrink:0;margin-top:1px;accent-color:var(--success);cursor:pointer}
.todo-main{flex:1;min-width:0}
.todo-name{font-size:.89rem;font-weight:650;color:var(--gray-800);line-height:1.45}
.todo.done .todo-name{text-decoration:line-through;color:var(--gray-400)}
.todo-desc{font-size:.75rem;color:var(--gray-500);line-height:1.55;margin-top:3px}
.todo-links{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.todo-link{font-size:.72rem;font-weight:650;color:var(--primary);background:var(--primary-lt);

.todo-link.ext{color:var(--gray-600);background:var(--gray-100)}

      { id:'arrive', name:'공항 도착 · 터미널 확인',
        desc:'T1과 T2는 이동에 시간이 걸립니다. 항공사별 터미널을 반드시 확인하고 출발하세요. 출국장 혼잡도는 실시간으로 확인할 수 있습니다.',
        links:[{ label:'실시간 혼잡도·출국장', url:'/airport#tab=depart' }] },
      { id:'lounge', name:'라운지 이용 (해당 시)',
        desc:'보유한 신용카드나 PP카드로 무료 이용이 되는지 확인하세요.',
        links:[{ label:'라운지 목록 보기', url:'/airport#tab=prep' }] },
      { id:'esim-on', name:'eSIM 활성화',
        desc:'현지 도착 후 데이터 로밍을 켜고 eSIM 회선으로 전환하면 됩니다.' }
    ]
  }
];

/* 제휴 수수료를 붙이지 않는 영역과 그 이유 (affiliates.js 미로드 시 폴백) */
var INFO_WHY = {
  insurance: '보험업법상 모집 규제 대상이라 제휴 수수료 구조를 붙이지 않습니다.',
  fx: '환전은 인가받은 금융기관 영역이라 제휴 대상이 아닙니다.'
};

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

var KEY_DATE = 'tripguide_depart_date';
var KEY_DONE = 'tripguide_prepare_done';

function getDone(){
  try { return JSON.parse(localStorage.getItem(KEY_DONE) || '{}'); } catch(e){ return {}; }
}
function setDone(map){
  try { localStorage.setItem(KEY_DONE, JSON.stringify(map)); } catch(e){}
}

/* 출발일 기준 각 단계의 실제 날짜 */
function stageDate(offset){
  var v = $('departDate').value;
  if (!v) return null;
  var d = new Date(v);
  if (isNaN(d)) return null;
  d.setDate(d.getDate() - offset);
  return d;
}
function fmt(d){
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + '일월화수목금토'[d.getDay()] + ')';
}
function daysLeft(){
  var v = $('departDate').value;
  if (!v) return null;
  var d = new Date(v); if (isNaN(d)) return null;
  var today = new Date(); today.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function render(){
  var done = getDone();
  var left = daysLeft();

  $('dday').textContent = left == null ? 'D-—'
    : left > 0 ? 'D-' + left : left === 0 ? 'D-DAY' : '출발일 지남';

  $('stages').innerHTML = STAGES.map(function(st){
    var dt = stageDate(st.offset);
    /* 현재 단계 = 아직 안 지났고 가장 가까운 것 */
    /* 마감이 이미 지난 단계 = 남은 일수가 그 단계의 기준일보다 적다.
       '지금 할 것' = 아직 안 지난 단계 중 기준일이 가장 큰(=가장 임박한) 하나. */
    var isPast = (left != null && left < st.offset);
    var isNow  = (left != null && !isPast &&
                  !STAGES.some(function(o){ return o.offset > st.offset && left >= o.offset; }));

    var body = st.todos.map(function(t){
      var tid = st.id + '_' + t.id;
      var isDone = !!done[tid];

      var links = (t.links || []).map(function(l){
        return '<a class="todo-link' + (l.ext ? ' ext' : '') + '" href="' + esc(l.url) + '"' +
          (l.ext ? ' target="_blank" rel="noopener"' : '') + '>' + esc(l.label) + '</a>';
      }).join('');

      /* 제휴 CTA — monetizable 카테고리만 */
      var cta = (t.cat && window.AFF) ? AFF.ctas(t.cat, null, { verb:'보기' }) : '';

      /* 수수료를 못 받는 영역은 그 이유를 밝히고 정보만 노출한다.
         affiliates.js가 못 뜨더라도 이 안내는 사라지면 안 되므로 자체 문구를 갖는다. */
      var info = '';
      if (t.info) {
        var why = (window.AFF && AFF.CATEGORIES[t.info] && AFF.CATEGORIES[t.info].why) || INFO_WHY[t.info] || '';
        info = '<div class="info-only">ℹ️ ' + esc(why) +
               ' 위 설명은 판단에 참고하시라고 정리한 것이며 특정 상품을 권유하지 않습니다.</div>';
      }

      return '' +
        '<div class="todo' + (isDone ? ' done' : '') + '">' +
          '<input type="checkbox" data-todo="' + esc(tid) + '"' + (isDone ? ' checked' : '') + '>' +
          '<div class="todo-main">' +
            '<div class="todo-name">' + esc(t.name) + '</div>' +
            '<div class="todo-desc">' + esc(t.desc) + '</div>' +
            (links || cta ? '<div class="todo-links">' + links + cta + '</div>' : '') +
            info +
          '</div>' +
        '</div>';
    }).join('');

    return '' +
      '<section class="stage' + (isNow ? ' now' : '') + (isPast ? ' past' : '') + '" id="stage-' + st.id + '">' +
        '<div class="stage-head">' +
          '<div class="stage-when">' + esc(st.when) + '<small>' + esc(st.whenSub) + '</small></div>' +
          '<div class="stage-title"><b>' + esc(st.title) + '</b>' +
            '<span>' + (dt ? fmt(dt) + ' · ' : '') + esc(st.desc) + '</span></div>' +
          (isNow ? '<span class="stage-badge">지금 할 것</span>' : '') +
        '</div>' +
        '<div class="stage-body">' + body + '</div>' +
      '</section>' +
      /* 짐 싸기(D-3) 단계 바로 뒤에 여행 준비물(토스쇼핑) 노출 — 구매 맥락과 일치 + 중간 배치라 잘 보임 */
      (st.id === 'd3' && window.AFF && AFF.goodsHtml ? AFF.goodsHtml() : '');
  }).join('');

  document.querySelectorAll('[data-todo]').forEach(function(cb){
    cb.addEventListener('change', function(){
      var map = getDone();
      if (cb.checked) map[cb.dataset.todo] = 1; else delete map[cb.dataset.todo];
      setDone(map);
      render();
    });
  });

  /* 진행률 */
  var total = STAGES.reduce(function(s,st){ return s + st.todos.length; }, 0);
  var cnt = Object.keys(getDone()).length;
  $('progText').textContent = cnt + ' / ' + total + ' 완료';
  $('progBar').style.width = (total ? (cnt/total*100) : 0) + '%';

  /* 지금 단계로 스크롤 (최초 1회만) */
  if (!window._prScrolled && left != null) {
    var now = document.querySelector('.stage.now');
    if (now) { window._prScrolled = true; }
  }
}

(function init(){
  var saved = '';
  try { saved = localStorage.getItem(KEY_DATE) || ''; } catch(e){}
  if (saved) $('departDate').value = saved;

  $('departDate').addEventListener('change', function(){
    try { localStorage.setItem(KEY_DATE, $('departDate').value); } catch(e){}
    window._prScrolled = false;
    render();
  });

  render();

  /* 여행 준비물 블록은 render() 안에서 D-3(짐 싸기) 단계 뒤에 노출된다 */

  /* 제휴 고지 — 링크가 있는 페이지엔 반드시 노출 */
  if (window.AFF) {
    var p = document.createElement('div');
    p.innerHTML = AFF.disclosureHtml();
    document.querySelector('.pr-wrap').insertBefore(p, document.querySelector('.pr-foot'));
  }
})();
</script>
