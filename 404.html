<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 - 트래블코스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #1e293b;
    }
    .emoji { font-size: 72px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 900; margin-bottom: 12px; }
    p { font-size: 16px; color: #64748b; margin-bottom: 32px; line-height: 1.6; }
    .badge {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 32px;
    }
    a.btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 10px;
      text-decoration: none;
      transition: background .15s;
    }
    a.btn:hover { background: #1d4ed8; }
    .more { margin-top: 18px; font-size: 14px; }
    .more a { color: #1B4FD8; font-weight: 700; text-decoration: none; display: inline-block; padding: 10px 4px; }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1B4FD8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="트래블코스트">
</head>
<body>
<main id="main">
  <div class="emoji">✈</div>
  <span class="badge">404 · 없는 주소</span>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 잘못 입력됐을 수 있어요.<br>아래에서 원하는 곳으로 이동해 주세요.</p>
  <a href="/" class="btn">← 홈으로</a>
  <p class="more"><a href="/destinations">여행지 가이드 전체</a> · <a href="/trips">내 여행</a> · <a href="/airport">인천공항 실시간</a></p>
<script src="/icons.js" defer></script>
<script src="/nav.js" defer></script>
<script src="/bizfooter.js" defer></script>
  <script src="/pwa-install.js" defer></script>
</main>
</body>
</html>
