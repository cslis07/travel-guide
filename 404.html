<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 - 트립가이드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #1e293b;
    }
    .emoji { font-size: 72px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 900; margin-bottom: 12px; }
    p { font-size: 16px; color: #64748b; margin-bottom: 32px; line-height: 1.6; }
    .badge {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 32px;
    }
    a.btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 10px;
      text-decoration: none;
      transition: background .15s;
    }
    a.btn:hover { background: #1d4ed8; }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>
  <div class="emoji">✈</div>
  <span class="badge">콘텐츠 준비 중</span>
  <h1>아직 가이드를 준비 중입니다</h1>
  <p>해당 여행지 가이드는 현재 제작 중입니다.<br>곧 완성된 가이드로 찾아올게요!</p>
  <a href="/" class="btn">← 여행지 목록으로 돌아가기</a>
<script src="/icons.js" defer></script>
<script src="/nav.js" defer></script>
</body>
</html>
